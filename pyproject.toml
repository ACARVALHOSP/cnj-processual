[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnj-processual"
version = "0.1.0"
description = "Servidor MCP para consulta processual judicial brasileira via APIs públicas do CNJ (DataJud e DJEN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["server"]
packages = ["cnj_processual"]
